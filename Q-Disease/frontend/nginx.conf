server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Proxy API calls to the Flask backend.
    # "backend" resolves via Docker Compose service name.
    location /api/ {
        proxy_pass            http://backend:8000;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        # Return a clean 502 (not nginx default page) if backend is down.
        proxy_intercept_errors on;
        error_page 502 503 504 =502 /api_down.json;
    }

    # Synthetic error body for backend-down responses — valid JSON so the
    # frontend error interceptor can parse it normally.
    location = /api_down.json {
        internal;
        default_type application/json;
        return 502 '{"success":false,"error":"Backend service unavailable. Please try again in a moment."}';
    }

    # React SPA — send all non-asset routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
